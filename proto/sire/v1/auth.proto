syntax = "proto3";

package sire.v1;

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OPERATOR = 1;
  ROLE_HOSPITAL = 2;
  ROLE_ADMIN = 3;
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  Role role = 4;
  // Only set for ROLE_HOSPITAL users.
  string hospital_id = 5;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
}

service AuthService {
  // Unary: exchange credentials for a signed token.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Unary: used by the gateway on every request (service-to-service).
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}
