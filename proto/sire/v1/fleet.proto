syntax = "proto3";

package sire.v1;

import "sire/v1/common.proto";

message Ambulance {
  string id = 1;
  string plate = 2;
  string crew = 3;
  AmbulanceStatus status = 4;
  GeoPoint location = 5;
  string incident_id = 6;
  double speed_kmh = 7;
  int64 updated_at_ms = 8;
}

message ListAmbulancesRequest {}

message ListAmbulancesResponse {
  repeated Ambulance ambulances = 1;
}

message FindNearestAmbulancesRequest {
  GeoPoint location = 1;
  int32 limit = 2;
}

message NearbyAmbulance {
  Ambulance ambulance = 1;
  double distance_km = 2;
}

message FindNearestAmbulancesResponse {
  repeated NearbyAmbulance ambulances = 1;
}

message SetAmbulanceStatusRequest {
  string ambulance_id = 1;
  AmbulanceStatus status = 2;
  string incident_id = 3;
}

message SetAmbulanceStatusResponse {
  Ambulance ambulance = 1;
}

message LocationUpdate {
  string ambulance_id = 1;
  GeoPoint location = 2;
  double speed_kmh = 3;
}

message StreamAmbulanceLocationResponse {
  int32 updates_received = 1;
  double distance_km = 2;
}

message WatchFleetRequest {}

message FleetEvent {
  Ambulance ambulance = 1;
}

service FleetService {
  rpc ListAmbulances(ListAmbulancesRequest) returns (ListAmbulancesResponse);
  // Unary, called by IncidentService (service-to-service).
  rpc FindNearestAmbulances(FindNearestAmbulancesRequest) returns (FindNearestAmbulancesResponse);
  // Unary, called by IncidentService / DispatchService (service-to-service).
  rpc SetAmbulanceStatus(SetAmbulanceStatusRequest) returns (SetAmbulanceStatusResponse);
  // Client streaming: an ambulance pushes its GPS position continuously.
  rpc StreamAmbulanceLocation(stream LocationUpdate) returns (StreamAmbulanceLocationResponse);
  // Server streaming: live fleet map (snapshot first, then every change).
  rpc WatchFleet(WatchFleetRequest) returns (stream FleetEvent);
}
